# ===== Server =====
# Railway sets PORT; locally it falls back to 8080
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ===== File uploads (images + videos) =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.file-size-threshold=2MB
server.tomcat.max-swallow-size=-1
server.tomcat.connection-timeout=300s

# Folder where uploads are saved (Railway volume is mounted at /app/uploads)
app.upload.dir=${UPLOAD_DIR:uploads}

# ===== Database (PostgreSQL on Railway) =====
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ecommerce}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Logging (shows the real cause of 500 errors in Railway logs) =====
logging.level.root=INFO
logging.level.org.springframework.web=INFO
server.error.include-message=always
