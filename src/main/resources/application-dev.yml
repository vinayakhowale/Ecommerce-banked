server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: -1
    connection-timeout: 300s
  error:
    include-message: always

spring:
  application:
    name: social-commerce-backend

  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ecommerce}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 200MB
      file-size-threshold: 2MB

logging:
  level:
    root: INFO
    org.springframework.web: INFO

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  # Add your own settings here, with the same names your code uses, e.g.:
  # jwt:
  #   secret: ${JWT_SECRET:change-me}
  #   expiration: 86400000
