server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: -1
    connection-timeout: 300s
  error:
    include-message: always

spring:
  datasource:
    # Uses DB_URL if set; otherwise builds the URL from Railway's Postgres variables
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:socommerce}}
    username: ${DB_USERNAME:${PGUSER:postgres}}
    password: ${DB_PASSWORD:${PGPASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Allow large image/video uploads
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 200MB
      file-size-threshold: 2MB

app:
  jwt:
    # Set JWT_SECRET in Railway Variables (long random string)
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
  upload:
    # Railway volume is mounted at /app/uploads
    dir: ${UPLOAD_DIR:/app/uploads}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}

logging:
  level:
    root: INFO
    com.socommerce.app: INFO

# Razorpay: app.razorpay.key-id / key-secret read from RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET.
# To go live, set those two variables to your "rzp_live_..." credentials in Railway.
# The RazorpayService startup log prints "LIVE" or "TEST" so you can confirm the mode.
